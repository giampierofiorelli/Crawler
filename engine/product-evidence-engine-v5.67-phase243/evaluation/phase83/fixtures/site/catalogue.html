<!doctype html><html lang="en"><title>Dynamic index</title><main><h1>All cleaning appliances</h1><div id="results"></div><button id="more">Load more</button></main><script>const all=['mattress-a1','mattress-a2','mattress-a3','mattress-a4'];let n=0;function add(){for(let i=0;i<2&&n<all.length;i++,n++){const a=document.createElement('article');a.dataset.entity='product';a.dataset.modelId=all[n];a.textContent=all[n];document.querySelector('#results').append(a);}if(n===all.length)document.querySelector('#more').hidden=true;}document.querySelector('#more').addEventListener('click',add);setTimeout(add,50);</script></html>
